<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM POS - Admin & Hisab Kitab</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #f8f9fa; color: #111; font-family: 'Poppins', sans-serif; margin: 0; padding: 15px; }
        header { border-bottom: 2px solid #000; padding: 12px 0; text-align: center; font-size: 22px; font-weight: 700; text-transform: uppercase; background: #fff; margin: -15px -15px 20px -15px; }
        
        /* Kamai Cards */
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: #fff; border: 2px solid #000; border-radius: 12px; padding: 15px; box-shadow: 3px 3px 0px #000; }
        .card h4 { margin: 0; font-size: 13px; color: #555; text-transform: uppercase; }
        .card .amount { font-size: 24px; font-weight: 700; margin-top: 5px; }
        
        /* Item Stock & Forms */
        .box { background: #fff; border: 2px solid #000; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 3px 3px 0px #000; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 2px dashed #ccc; padding-bottom: 8px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #000; border-radius: 8px; font-family: 'Poppins', sans-serif; box-sizing: border-box; font-size: 14px; }
        button { background: #000; color: #fff; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        
        /* Items Row */
        .row-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
        .badge-stock { background: #e8f5e9; color: #2e7d32; font-weight: bold; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
        .badge-out { background: #ffebee; color: #c62828; font-weight: bold; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
        
        /* History Row */
        .bill-card { background: #fdfdfd; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .bill-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
        .bill-items { font-size: 12px; color: #444; margin-top: 4px; }
        .bill-date { font-size: 10px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

    <header>OM POS - Dukan Ka Hisab</header>

    <!-- KUL KAMAI (TOP STATS) -->
    <div class="summary-box">
        <div class="card">
            <h4>Total Kamai</h4>
            <div class="amount" id="totalSale" style="color: #2e7d32;">₹ 0</div>
        </div>
        <div class="card">
            <h4>Total Bill Kate</h4>
            <div class="amount" id="totalBills">0</div>
        </div>
    </div>

    <!-- STOCK & ITEMS (KITNA BACHA HAI) -->
    <div class="box">
        <h3>Store Mein Kitna Cake Bacha Hai</h3>
        <div id="stockList">Loading stock...</div>
    </div>

    <!-- SALES REPORT (KONSE BILL MEIN KYA BIKA) -->
    <div class="box">
        <h3>Pichli Bikri (Sales History)</h3>
        <div id="historyList">Loading history...</div>
    </div>

    <!-- ADD ITEM FORM -->
    <div class="box">
        <h3>Naya Cake / Item Jodein</h3>
        <input type="text" id="itemName" placeholder="Cake ka naam (e.g. Pineapple)">
        <input type="number" id="itemPrice" placeholder="Price (₹)">
        <input type="text" id="itemIcon" placeholder="Emoji (e.g. 🎂)">
        <input type="number" id="itemStock" placeholder="Kitna piece hai (Stock)">
        <button onclick="addProduct()">Save to Menu</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDk1imNgksW5aLhUGe7-DWk3RWw1gaOaVs",
            authDomain: "cake-shop-pos.firebaseapp.com",
            databaseURL: "https://cake-shop-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cake-shop-pos",
            storageBucket: "cake-shop-pos.firebasestorage.app",
            messagingSenderId: "259110458276",
            appId: "1:259110458276:web:2d2f5a61364e5a77aea731"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. STOCK LIST DIKHANA
        db.ref('products').on('value', (snapshot) => {
            const list = document.getElementById('stockList');
            list.innerHTML = '';
            if (!snapshot.exists()) {
                list.innerHTML = '<p>Menu mein koi cake nahi hai.</p>';
                return;
            }
            snapshot.forEach(child => {
                const item = child.val();
                const badge = item.stock <= 0 
                    ? '<span class="badge-out">OUT OF STOCK (0)</span>' 
                    : `<span class="badge-stock">Bacha Hai: ${item.stock} piece</span>`;

                list.innerHTML += `
                    <div class="row-item">
                        <div>
                            <b>${item.icon || '🍰'} ${item.name}</b> (₹${item.price})<br>
                            ${badge}
                        </div>
                        <button style="width: auto; padding: 4px 10px; margin: 0; font-size: 11px; background: #fff; color: #c62828; border-color: #c62828;" onclick="deleteItem('${child.key}')">Hatao</button>
                    </div>
                `;
            });
        });

        // 2. BIKRI KA HISAB (SALES HISTORY & TOTAL KAMAI)
        db.ref('sales_history').on('value', (snapshot) => {
            const histDiv = document.getElementById('historyList');
            histDiv.innerHTML = '';
            
            let totalAmount = 0;
            let billCount = 0;

            if (!snapshot.exists()) {
                histDiv.innerHTML = '<p>Abhi tak koi bikri nahi hui.</p>';
                document.getElementById('totalSale').innerText = '₹ 0';
                document.getElementById('totalBills').innerText = '0';
                return;
            }

            const bills = [];
            snapshot.forEach(child => {
                const b = child.val();
                totalAmount += (b.total_amount || 0);
                billCount++;
                bills.unshift(b); // naya bill upar
            });

            document.getElementById('totalSale').innerText = `₹ ${totalAmount}`;
            document.getElementById('totalBills').innerText = billCount;

            bills.forEach(bill => {
                let itemsList = '';
                if(bill.items && Array.isArray(bill.items)) {
                    itemsList = bill.items.map(i => `${i.name} (${i.qty} piece)`).join(' + ');
                }
                
                histDiv.innerHTML += `
                    <div class="bill-card">
                        <div class="bill-top">
                            <span>Bill Total:</span>
                            <span style="color:#2e7d32;">₹${bill.total_amount}</span>
                        </div>
                        <div class="bill-items">🎂 <b>Kharida:</b> ${itemsList}</div>
                        <div class="bill-date">⏰ ${bill.date}</div>
                    </div>
                `;
            });
        });

        // Naya Product Dalna
        function addProduct() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const icon = document.getElementById('itemIcon').value || '🍰';
            const stock = document.getElementById('itemStock').value || 0;

            if (!name || !price) {
                alert("Naam aur Price zaroor bharein!");
                return;
            }

            db.ref('products').push({
                name: name,
                price: Number(price),
                icon: icon,
                stock: Number(stock)
            }).then(() => {
                document.getElementById('itemName').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('itemIcon').value = '';
                document.getElementById('itemStock').value = '';
            });
        }

        function deleteItem(key) {
            if(confirm("Kya is cake ko menu se hatana chahte hain?")) {
                db.ref('products/' + key).remove();
            }
        }
    </script>
</body>
</html>
