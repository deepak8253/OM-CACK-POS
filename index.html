<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM POS - Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { border-bottom: 3px solid #000000; padding: 15px 20px; text-align: center; font-size: 22px; font-weight: 700; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .branch-tag { font-size: 12px; background: #000; color: #fff; padding: 4px 10px; border-radius: 6px; }
        .pos-container { display: flex; flex-direction: row; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .pos-container { flex-direction: column; } .product-section { border-right: none; border-bottom: 3px solid #000000; height: 55%; } .cart-section { height: 45%; } }
        
        .product-section { flex: 6.5; padding: 20px; overflow-y: auto; border-right: 3px solid #000000; }
        .section-title { font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 2px dashed #000000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .product-card { border: 2px solid #000000; border-radius: 16px; padding: 12px 8px; text-align: center; cursor: pointer; user-select: none; box-shadow: 4px 4px 0px #000000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 120px; }
        .product-card:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000000; }
        .product-icon { font-size: 30px; margin-bottom: 8px; }
        .product-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; line-height: 1.2; }
        .price-tag { font-size: 13px; font-weight: 700; background-color: #000000; color: #ffffff; padding: 3px 10px; border-radius: 20px; margin-top: auto; }
        .stock-badge { font-size: 11px; margin-top: 6px; color: #444; font-weight: bold;}

        .cart-section { flex: 3.5; padding: 20px; display: flex; flex-direction: column; }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #000000; font-weight: 600; font-size: 14px; }
        .qty-badge { background-color: #000000; color: #ffffff; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
        .cart-total-container { border: 2px solid #000000; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .cart-total { font-size: 22px; font-weight: 700; display: flex; justify-content: space-between; }
        .checkout-btn { background-color: #000000; color: #ffffff; border: 2px solid #000000; padding: 16px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; text-transform: uppercase; }

        #printable-receipt { display: none; }
        @media print {
            body > *:not(#printable-receipt) { display: none !important; }
            @page { margin: 0; }
            body { background-color: #ffffff !important; color: #000000 !important; }
            #printable-receipt { display: block; width: 58mm; margin: 0 auto; padding: 10px 5px; font-family: monospace; font-size: 12px; }
            .receipt-header { text-align: center; margin-bottom: 8px; }
            .receipt-header h2 { margin: 0; font-size: 16px; letter-spacing: 1px; }
            .receipt-sub { margin: 2px 0; font-size: 11px; font-weight: bold; }
            .receipt-address { font-size: 10px; margin: 2px 0; line-height: 1.2; }
            .divider { border-top: 1px dashed #000000; margin: 5px 0; }
            .receipt-items { width: 100%; text-align: left; margin-bottom: 8px; }
            .receipt-items th, .receipt-items td { padding: 3px 0; font-size: 11px; }
            .receipt-items th { border-bottom: 1px dashed #000000; }
            .text-right { text-align: right; }
            .receipt-total { font-weight: bold; font-size: 14px; margin-top: 8px; text-align: right; }
            .receipt-footer { text-align: center; margin-top: 12px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <span>OM POS</span>
        <span class="branch-tag" id="screenBranch">Loading...</span>
    </header>

    <div class="pos-container">
        <div class="product-section">
            <h3 class="section-title">Live Cloud Menu</h3>
            <div class="grid" id="productGrid">Loading items...</div>
        </div>
        <div class="cart-section">
            <h3 class="section-title">Current Order</h3>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total-container">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="totalAmount">₹ 0</span>
                </div>
            </div>
            <button class="checkout-btn" onclick="checkout()">Print & Save Bill</button>
        </div>
    </div>

    <!-- 58mm Slip (Fixed Shop Name + Dynamic Cloud Branch Address) -->
    <div id="printable-receipt">
        <div class="receipt-header">
            <h2>THE CAKE SHOP</h2>
            <p id="receiptBranchName" class="receipt-sub">Branch</p>
            <p id="receiptAddress" class="receipt-address">Address</p>
            <p style="margin:2px 0;">Date: <span id="receiptDate"></span></p>
        </div>
        <div class="divider"></div>
        <table class="receipt-items">
            <thead>
                <tr><th>Item</th><th class="text-right">Qty</th><th class="text-right">Price</th></tr>
            </thead>
            <tbody id="receiptBody"></tbody>
        </table>
        <div class="divider"></div>
        <div class="receipt-total">Total: <span id="receiptTotalAmount">₹ 0</span></div>
        <div class="receipt-footer"><p>Thank you!</p><p>- Powered by OM POS -</p></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDk1imNgksW5aLhUGe7-DWk3RWw1gaOaVs",
            authDomain: "cake-shop-pos.firebaseapp.com",
            databaseURL: "https://cake-shop-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cake-shop-pos",
            storageBucket: "cake-shop-pos.firebasestorage.app",
            messagingSenderId: "259110458276",
            appId: "1:259110458276:web:2d2f5a61364e5a77aea731"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. DYNAMIC CLOUD BRANCH RESOLVER
        const urlParams = new URLSearchParams(window.location.search);
        const branchCode = (urlParams.get('branch') || 'b1').toLowerCase();

        let currentBranch = {
            code: branchCode,
            name: "Main Branch",
            address: "Main Market Road"
        };

        db.ref('branches/' + branchCode).on('value', (snap) => {
            if (snap.exists()) {
                currentBranch = snap.val();
            }
            document.getElementById('screenBranch').innerText = currentBranch.name;
        });

        // 2. LIVE MENU & STOCK
        let cart = [];
        let grandTotal = 0;

        db.ref('products').on('value', (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(!snapshot.exists()) {
                grid.innerHTML = '<p>Menu khali hai.</p>';
                return;
            }
            snapshot.forEach((child) => {
                const product = child.val();
                product.id = child.key;
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product);
                card.innerHTML = `
                    <div class="product-icon">${product.icon || '🍰'}</div>
                    <div class="product-name">${product.name}</div>
                    <span class="price-tag">₹${product.price}</span>
                    <div class="stock-badge">Stock: ${product.stock}</div>
                `;
                grid.appendChild(card);
            });
        });

        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            const qty = existingItem ? existingItem.qty : 0;
            if (qty >= product.stock) {
                alert(`Stock khatam! Max available: ${product.stock}`);
                return;
            }
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            cartDiv.innerHTML = '';
            grandTotal = 0;
            cart.forEach(item => {
                const total = item.price * item.qty;
                grandTotal += total;
                cartDiv.innerHTML += `
                    <div class="cart-item">
                        <div>${item.name} <span class="qty-badge">x${item.qty}</span></div>
                        <span>₹${total}</span>
                    </div>
                `;
            });
            document.getElementById('totalAmount').innerText = `₹ ${grandTotal}`;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Pehle cake select karein!');
                return;
            }
            const currentDate = new Date().toLocaleString();

            // Cloud Save with Branch Details
            db.ref('sales_history').push({
                branch_code: currentBranch.code,
                branch: currentBranch.name,
                address: currentBranch.address,
                date: currentDate,
                items: cart,
                total_amount: grandTotal
            }).then(() => {
                // Stock minus
                cart.forEach(item => {
                    db.ref('products/' + item.id).update({ stock: item.stock - item.qty });
                });

                // Set Receipt Details
                document.getElementById('receiptBranchName').innerText = currentBranch.name;
                document.getElementById('receiptAddress').innerText = currentBranch.address;
                document.getElementById('receiptDate').innerText = currentDate;

                const tbody = document.getElementById('receiptBody');
                tbody.innerHTML = '';
                cart.forEach(item => {
                    tbody.innerHTML += `<tr><td>${item.name}</td><td class="text-right">${item.qty}</td><td class="text-right">${item.price * item.qty}</td></tr>`;
                });
                document.getElementById('receiptTotalAmount').innerText = `₹ ${grandTotal}`;

                window.print();
                cart = [];
                updateCart();
            });
        }
    </script>
</body>
</html>
