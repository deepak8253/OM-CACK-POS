<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM POS - Cake Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase Compat Libraries (Offline/Direct HTML ke liye) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        /* Base Setup */
        body { background-color: #ffffff; color: #000000; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { border-bottom: 3px solid #000000; padding: 20px; text-align: center; font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .pos-container { display: flex; flex-direction: row; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .pos-container { flex-direction: column; } .product-section { border-right: none; border-bottom: 3px solid #000000; height: 55%; } .cart-section { height: 45%; } }
        
        /* Grid & Cards */
        .product-section { flex: 6.5; padding: 25px; overflow-y: auto; border-right: 3px solid #000000; }
        .section-title { font-size: 22px; font-weight: 700; margin-top: 0; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px dashed #000000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .product-card { border: 2px solid #000000; border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; user-select: none; box-shadow: 5px 5px 0px #000000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 130px; }
        .product-card:active { transform: translate(5px, 5px); box-shadow: 0px 0px 0px #000000; }
        .product-icon { font-size: 38px; margin-bottom: 12px; }
        .product-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.2; }
        .price-tag { font-size: 15px; font-weight: 700; background-color: #000000; color: #ffffff; padding: 6px 14px; border-radius: 20px; margin-top: auto; }

        /* Cart */
        .cart-section { flex: 3.5; padding: 25px; display: flex; flex-direction: column; }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #000000; font-weight: 600; }
        .qty-badge { background-color: #000000; color: #ffffff; padding: 3px 10px; border-radius: 12px; font-size: 13px; margin-left: 10px; }
        .cart-total-container { border: 2px solid #000000; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .cart-total { font-size: 26px; font-weight: 700; display: flex; justify-content: space-between; }
        .checkout-btn { background-color: #000000; color: #ffffff; border: 2px solid #000000; padding: 20px; font-size: 20px; font-weight: 700; border-radius: 12px; cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px rgba(0,0,0,1); }
        .checkout-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px rgba(0,0,0,1); }

        /* Thermal Print Rules */
        #printable-receipt { display: none; }
        @media print {
            body > *:not(#printable-receipt) { display: none !important; }
            @page { margin: 0; }
            body { background-color: #ffffff !important; color: #000000 !important; }
            #printable-receipt { display: block; width: 58mm; margin: 0 auto; padding: 10px 5px; font-family: monospace; font-size: 12px; }
            .receipt-header { text-align: center; margin-bottom: 10px; }
            .receipt-header h2 { margin: 0; font-size: 16px; }
            .divider { border-top: 1px dashed #000000; margin: 5px 0; }
            .receipt-items { width: 100%; text-align: left; margin-bottom: 10px; }
            .receipt-items th, .receipt-items td { padding: 3px 0; font-size: 11px; }
            .receipt-items th { border-bottom: 1px dashed #000000; }
            .text-right { text-align: right; }
            .receipt-total { font-weight: bold; font-size: 14px; margin-top: 10px; text-align: right; }
            .receipt-footer { text-align: center; margin-top: 15px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- Main Screen -->
    <header>OM POS - Multi Branch</header>
    <div class="pos-container">
        <div class="product-section">
            <h3 class="section-title">Menu Items</h3>
            <div class="grid" id="productGrid"></div>
        </div>
        <div class="cart-section">
            <h3 class="section-title">Current Order</h3>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total-container">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="totalAmount">₹ 0</span>
                </div>
            </div>
            <button class="checkout-btn" onclick="checkout()">Print & Save Bill</button>
        </div>
    </div>

    <!-- Thermal Receipt -->
    <div id="printable-receipt">
        <div class="receipt-header">
            <h2>THE CAKE SHOP</h2>
            <p>Main Branch</p>
            <p>Date: <span id="receiptDate"></span></p>
        </div>
        <div class="divider"></div>
        <table class="receipt-items">
            <thead>
                <tr><th>Item</th><th class="text-right">Qty</th><th class="text-right">Price</th></tr>
            </thead>
            <tbody id="receiptBody"></tbody>
        </table>
        <div class="divider"></div>
        <div class="receipt-total">Total: <span id="receiptTotalAmount">₹ 0</span></div>
        <div class="receipt-footer"><p>Thank you!</p><p>- Powered by OM POS -</p></div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION (Aapki Keys)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDk1imNgksW5aLhUGe7-DWk3RWw1gaOaVs",
            authDomain: "cake-shop-pos.firebaseapp.com",
            databaseURL: "https://cake-shop-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cake-shop-pos",
            storageBucket: "cake-shop-pos.firebasestorage.app",
            messagingSenderId: "259110458276",
            appId: "1:259110458276:web:2d2f5a61364e5a77aea731"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. POS SYSTEM LOGIC
        // ==========================================
        const products = [
            { id: 1, name: 'Black Forest', price: 450, icon: '🎂' },
            { id: 2, name: 'Pineapple Cake', price: 350, icon: '🍍' },
            { id: 3, name: 'Choco Truffle', price: 550, icon: '🍫' },
            { id: 4, name: 'Red Velvet', price: 600, icon: '🍰' }
        ];

        let cart = [];
        let grandTotal = 0;

        function loadProducts() {
            const grid = document.getElementById('productGrid');
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product);
                card.innerHTML = `<div class="product-icon">${product.icon}</div><div class="product-name">${product.name}</div><span class="price-tag">₹${product.price}</span>`;
                grid.appendChild(card);
            });
        }

        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) existingItem.qty += 1;
            else cart.push({ ...product, qty: 1 });
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cartItems');
            cartDiv.innerHTML = '';
            grandTotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                grandTotal += itemTotal;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `<div>${item.name} <span class="qty-badge">x${item.qty}</span></div><span>₹${itemTotal}</span>`;
                cartDiv.appendChild(div);
            });
            document.getElementById('totalAmount').innerText = `₹ ${grandTotal}`;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Pehle items select karein!');
                return;
            }

            const currentDate = new Date().toLocaleString();

            // 1. Send Data to Firebase
            db.ref('sales_history').push({
                branch: "Main Branch",
                date: currentDate,
                items: cart,
                total_amount: grandTotal
            }).then(() => {
                // 2. Prepare Thermal Receipt
                document.getElementById('receiptDate').innerText = currentDate;
                const receiptBody = document.getElementById('receiptBody');
                receiptBody.innerHTML = '';
                
                cart.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${item.name}</td><td class="text-right">${item.qty}</td><td class="text-right">${item.price * item.qty}</td>`;
                    receiptBody.appendChild(tr);
                });
                document.getElementById('receiptTotalAmount').innerText = `₹ ${grandTotal}`;

                // 3. Print Command & Reset
                window.print();
                cart = []; 
                updateCart();
            }).catch((error) => {
                alert("Cloud me save nahi ho paya. Internet connection check karein.");
            });
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
